site_name: AEGIS
site_description: >-
  Zero-Trust Security Layer pour agents LLM et pipelines RAG — couverture
  OWASP GenAI LLM Top 10, édition 2026.
site_author: Yahya El Houti
repo_url: https://github.com/Yahya-wa3er/AEGIS
repo_name: Yahya-wa3er/AEGIS
edit_uri: edit/main/docs/
copyright: >-
  MIT — voir <a href="https://github.com/Yahya-wa3er/AEGIS/blob/main/LICENSE">LICENSE</a>.
  Projet de recherche / démonstration, pas un produit audité pour la production.

theme:
  name: material
  language: fr
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: material/shield-lock-outline
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
    admonition:
      note: material/pin-outline
      example: material/flask-outline
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Basculer en thème sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Basculer en thème clair
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.path
    - navigation.prune
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.tooltips
    - search.suggest
    - search.highlight
    - search.share

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - toc:
      permalink: true
      title: Sur cette page

nav:
  - Accueil: index.md
  - Comprendre AEGIS:
      - Modèle de menace et architecture: architecture.md
      - Les composants, un par un: composants.md
      - Couverture OWASP LLM Top 10: owasp.md
  - Preuves et rigueur:
      - Méthodologie de mesure: mesure.md
      - MLOps — registre, promotion, dérive: mlops.md
      - Chaîne d'approvisionnement: chaine-approvisionnement.md
      - Limites connues, consolidées: limites.md
      - Statistiques du projet: statistiques.md
  - Passer à l'action:
      - Chemin vers un déploiement de production: deploiement.md
      - Feuille de route priorisée: feuille-de-route.md
      - Brancher AEGIS sur un agent existant: integration.md
  - Cartes de modèles:
      - Vue d'ensemble: model_cards/index.md
      - rag_outlier: model_cards/rag_outlier.md
      - behavior_vae: model_cards/behavior_vae.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Yahya-wa3er/AEGIS
