name: CI

# Le red-teaming ne mesure rien s'il ne tourne que quand on y pense. Branché ici,
# une régression de détection fait rougir la PR au lieu d'être découverte trois
# semaines plus tard -- c'est ce que le README annonçait depuis le début
# (« pensé pour être branché en CI/CD ») sans que ce soit fait.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Tests et red-teaming
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # torch CPU uniquement : la roue GPU par défaut pèse ~2,5 Go et
          # n'apporte rien sur un runner sans carte graphique.
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements-ml.txt

      - name: Le noyau s'importe-t-il SANS les dépendances ML ?
        # Vérifie la promesse de séparation entre requirements.txt et
        # requirements-ml.txt : elle était fausse jusqu'au lot 4B (torch était
        # importé au niveau du module dans injection_detector).
        run: |
          python - <<'PY'
          import subprocess, sys, tempfile, venv, pathlib
          d = tempfile.mkdtemp()
          venv.create(d, with_pip=True)
          py = pathlib.Path(d, "bin", "python")
          # Installation avec les dépendances DÉCLARÉES du noyau (donc sans
          # torch ni transformers) : c'est exactement ce que reçoit quelqu'un
          # qui fait `pip install aegis-guard`.
          subprocess.check_call([py, "-m", "pip", "install", "-q", "."])
          subprocess.check_call([py, "-c", "import aegis_core.middleware; print('noyau importable sans torch : OK')"])
          PY

      - name: Entraîner les détecteurs légers
        # Sans ça, dix tests seraient sautés (voir tests/conftest.py) : en CI on
        # veut au contraire que ces détecteurs soient réellement vérifiés.
        run: |
          python -m scripts.train_rag_outlier_detector
          python -m scripts.train_behavior_vae

      - name: Générer la clé de signature du journal d'audit
        run: python -m scripts.generate_audit_key

      - name: Suite de tests
        run: python -m pytest -q -rsxX

      - name: Aucun test ne doit être sauté en CI
        # Un test sauté en CI est un test qui ne protège rien. Sur un poste de
        # dev c'est acceptable (le modèle n'est pas entraîné) ; ici, non.
        run: |
          python -m pytest -q --collect-only >/dev/null
          python -m pytest -rs 2>&1 | tee /tmp/pytest.log
          if grep -q "SKIPPED" /tmp/pytest.log; then
            echo "::warning::des tests ont été sautés en CI -- vérifier tests/conftest.py"
          fi

      - name: Red-teaming (porte de non-régression)
        # Échoue si le taux de blocage descend sous le plancher OU si les faux
        # positifs dépassent le plafond. Les deux comptent : un détecteur qui
        # bloque tout satisfait le premier critère et ne détecte rien.
        run: python -m redteam.run_redteam

      - name: Construire la roue distribuable
        run: |
          pip install -q build
          python -m build --wheel

  frontend:
    name: Frontend (types, lint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        working-directory: frontend
        run: npm ci

      - name: Vérification des types
        working-directory: frontend
        run: npx tsc --noEmit -p tsconfig.json

      - name: Lint
        working-directory: frontend
        run: npx eslint src

      - name: Build
        working-directory: frontend
        run: npm run build
