name: CI

# Le red-teaming ne mesure rien s'il ne tourne que quand on y pense. Branché ici,
# une régression de détection fait rougir la PR au lieu d'être découverte trois
# semaines plus tard -- c'est ce que le README annonçait depuis le début
# (« pensé pour être branché en CI/CD ») sans que ce soit fait.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Tests et red-teaming
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Installer les dépendances ML (variante CPU)
        # requirements-ml.txt N'EST PAS utilisé ici, volontairement : il a été
        # généré sur une machine compatible CUDA et épingle donc 15 paquets
        # nvidia-* (~2,5 Go de roues GPU). Un runner GitHub n'a pas de carte
        # graphique : les télécharger ferait exploser la durée du job pour rien.
        #
        # On installe donc la variante CPU depuis l'index PyTorch dédié, puis
        # les paquets purement Python depuis PyPI. Le compromis est assumé et
        # écrit : la CI ne vérifie pas le lock ML tel quel. C'est le prix d'un
        # lock unique généré sur un poste GPU -- la correction propre est un
        # second lock CPU (requirements-ml-cpu.txt), à faire quand quelqu'un
        # d'autre que Yahya installera le projet.
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.6,<3"
          pip install "transformers>=4.44,<6" "scikit-learn>=1.5,<2"

      - name: Le noyau s'importe-t-il SANS les dépendances ML ?
        # Vérifie la promesse de séparation entre requirements.txt et
        # requirements-ml.txt : elle était fausse jusqu'au lot 4B (torch était
        # importé au niveau du module dans injection_detector).
        run: |
          python - <<'PY'
          import subprocess, sys, tempfile, venv, pathlib
          d = tempfile.mkdtemp()
          venv.create(d, with_pip=True)
          py = pathlib.Path(d, "bin", "python")
          # Installation avec les dépendances DÉCLARÉES du noyau (donc sans
          # torch ni transformers) : c'est exactement ce que reçoit quelqu'un
          # qui fait `pip install aegis-guard`.
          subprocess.check_call([py, "-m", "pip", "install", "-q", "."])
          subprocess.check_call([py, "-c", "import aegis_core.middleware; print('noyau importable sans torch : OK')"])
          PY

      - name: Les corpus versionnés correspondent-ils à leur générateur ?
        # Défaut trouvé au lot 5A : `data/rag_corpus_eval.jsonl` contenait 4
        # payloads empoisonnés là où le générateur en produisait 14. Les chiffres
        # publiés avaient donc été mesurés sur un corpus que plus personne ne
        # pouvait reproduire -- relancer le script donnait d'autres résultats.
        # Un corpus qui dérive de son générateur est une mesure qui dérive de sa
        # méthode, en silence.
        run: |
          python -m scripts.generate_rag_corpus
          python -m scripts.generate_behavior_sessions
          # --porcelain plutôt que `git diff` : il attrape aussi les fichiers
          # NOUVEAUX, c'est-à-dire le cas où le générateur produit un jeu que
          # personne n'a commité.
          if [ -n "$(git status --porcelain -- data/)" ]; then
            echo "::error::data/ ne correspond plus à son générateur — relance les scripts et commite le résultat"
            git status --porcelain -- data/
            git diff --stat -- data/
            exit 1
          fi

      - name: Entraîner les détecteurs légers
        # Sans ça, plusieurs tests seraient sautés (voir tests/conftest.py) : en
        # CI on veut au contraire que ces détecteurs soient réellement vérifiés.
        # Les scripts refusent de démarrer si les jeux se recouvrent
        # (scripts/dataset_split.assert_no_leakage).
        run: |
          python -m scripts.train_rag_outlier_detector
          python -m scripts.train_behavior_vae

      - name: Générer la clé de signature du journal d'audit
        run: python -m scripts.generate_audit_key

      - name: Suite de tests
        # -rsxX liste les tests sautés et les xfail dans le résumé. Un test sauté
        # en CI est un test qui ne protège rien : sur un poste de dev c'est
        # acceptable (le modèle n'est pas entraîné), ici c'est un signal.
        # Une seule exécution suffit à le voir -- relancer pytest deux fois de
        # plus pour compter les SKIPPED coûtait trois fois le temps du job.
        #
        # La clé est FACTICE et l'URL pointe sur un port mort, volontairement.
        # Défaut trouvé au lot 7.2 : les tests de limitation de débit
        # appelaient RÉELLEMENT OpenRouter sur la machine de dev -- une dizaine
        # d'appels payants par exécution de la suite, dans le fichier même
        # censé prouver qu'on avait bouché Unbounded Consumption. Ils passaient
        # ici parce qu'aucune clé n'était configurée, ce qui masquait le
        # problème au lieu de le révéler.
        #
        # Avec ces deux variables, tout test qui tenterait un appel réseau
        # échoue au lieu de dépenser. Une suite de tests qui coûte de l'argent
        # est une suite qu'on finit par ne plus lancer.
        env:
          OPENROUTER_API_KEY: cle-factice-aucun-appel-ne-doit-partir
          OPENROUTER_BASE_URL: http://127.0.0.1:9/aucun-appel-llm-en-ci
        run: |
          python -m pytest -q -rsxX 2>&1 | tee /tmp/pytest.log
          if grep -qE "^SKIPPED|s  *\[" /tmp/pytest.log; then
            echo "::warning::des tests ont été sautés en CI -- vérifier tests/conftest.py"
          fi

      - name: Red-teaming (porte de non-régression)
        # Échoue si le taux de blocage descend sous le plancher OU si les faux
        # positifs dépassent le plafond. Les deux comptent : un détecteur qui
        # bloque tout satisfait le premier critère et ne détecte rien.
        run: python -m redteam.run_redteam

      - name: Banc de scénarios
        # Complémentaire de la porte de non-régression : celui-ci vérifie que
        # chaque scénario se comporte comme il l'annonce, SIGNAUX COMPRIS. Un
        # blocage obtenu par le mauvais détecteur est un coup de chance.
        run: python -m redteam.run_scenarios

      - name: Latence des points d'interception
        # Non bloquant : la latence d'un runner partagé varie trop pour servir de
        # porte. Le journal du job garde en revanche une trace datée, ce qui rend
        # une dérive visible en comparant deux runs -- et surtout, le chiffre
        # existe, ce qui n'était pas le cas.
        run: python -m scripts.benchmark_latency --iterations 100 --json /tmp/latence.json

      - name: Porte de promotion (registre de modèles)
        # Refuse un modèle dont une métrique montre une RÉGRESSION PROUVÉE :
        # intervalles de Wilson disjoints dans le mauvais sens. Un simple « le
        # nouveau chiffre est plus grand » ne suffit pas -- passer de 12/14 à
        # 13/14 fait monter le point de 86 % à 93 % et ne démontre rien, les
        # intervalles se recouvrant largement.
        #
        # `check` ne touche jamais au registre : la promotion est un geste
        # délibéré (`promote`), pas un effet de bord de la CI.
        run: python -m scripts.model_registry_cli check

      - name: Le modèle mesuré est-il celui qu'on obtient ?
        # Les deux détecteurs légers sont bit-reproductibles : réentraînés sur
        # les mêmes données versionnées, ils produisent les mêmes artefacts. Ce
        # contrôle vérifie donc que les chiffres publiés décrivent bien le
        # modèle que ce dépôt permet de reconstruire.
        #
        # Le manifeste de model_io ne répond PAS à cette question : il prouve
        # qu'un artefact n'a pas été altéré depuis son écriture, pas que c'est
        # l'artefact sur lequel les mesures ont été obtenues.
        #
        # Si cette étape rougit après une montée de version de torch ou de
        # scikit-learn, ce n'est pas un faux positif : les chiffres du registre
        # ne décrivent plus ce que produit le dépôt. La réponse est de relancer
        # `promote` et de commiter le nouveau registre.
        run: python -m scripts.model_registry_cli verify

      - name: Les cartes de modèle correspondent-elles au registre ?
        # Même dispositif que pour data/ : un document généré qui dérive de son
        # générateur est une documentation qui dérive de la réalité, en silence.
        run: |
          python -m scripts.model_registry_cli cards
          if [ -n "$(git status --porcelain -- docs/model_cards/)" ]; then
            echo "::error::docs/model_cards/ ne correspond plus au registre — relance 'python -m scripts.model_registry_cli cards' et commite"
            git diff -- docs/model_cards/
            exit 1
          fi

      - name: Aucune mesure codée en dur dans l'assistant
        # L'assistant compose ses réponses à partir du README, des scénarios et
        # des fichiers de métriques, relus à l'exécution. Un chiffre recopié à
        # la main dans `web/assistant.py` dériverait de sa source -- défaut déjà
        # payé deux fois : sur `data/` au lot 5A (corpus versionné qui ne
        # correspondait plus à son générateur) et sur le TTR figé de la console
        # au lot 7. Le contrôle passe par l'AST du module, pas par une regex sur
        # le texte : la première version signalait la prose des commentaires qui
        # explique justement pourquoi il ne faut pas coder un chiffre en dur.
        run: |
          python - <<'PY'
          import sys
          from web.assistant import mesures_en_dur
          suspects = mesures_en_dur()
          if suspects:
              print("::error::des littéraux numériques sont codés en dur dans web/assistant.py")
              for s in suspects:
                  print(f"  {s}")
              sys.exit(1)
          print("aucune mesure codée en dur : OK")
          PY

      - name: Contrastes de la console (WCAG 2.1 AA)
        # Une première version de globals.css annonçait des ratios que personne
        # n'avait calculés : quatre échouaient, dont le texte blanc de la pilule
        # de navigation active à 2,3:1 -- l'élément le plus cliqué de
        # l'interface. Un jeu de couleurs se vérifie, comme un taux de détection.
        #
        # L'étape est dans le job Python et non dans celui du frontend : le
        # script ne fait que lire un fichier CSS, il n'a besoin ni de node ni des
        # dépendances de l'application.
        run: python -m scripts.check_contrast

      - name: Construire la roue distribuable
        run: |
          pip install -q build
          python -m build --wheel

  frontend:
    name: Frontend (types, lint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        working-directory: frontend
        run: npm ci

      # `LayoutProps<"/">` et consorts sont des types GÉNÉRÉS par Next dans
      # `.next/types`, que `tsconfig.json` inclut. Sur un clone frais ce
      # répertoire n'existe pas, et `tsc` échouait avant même de regarder le code
      # (« Cannot find name 'LayoutProps' »). Un poste de dev ne le voyait pas :
      # il avait déjà lancé `next dev` ou `next build` au moins une fois.
      - name: Générer les types de routes
        working-directory: frontend
        run: npx next typegen

      - name: Vérification des types
        working-directory: frontend
        run: npx tsc --noEmit -p tsconfig.json

      - name: Lint
        working-directory: frontend
        run: npx eslint src

      - name: Build
        working-directory: frontend
        run: npm run build
