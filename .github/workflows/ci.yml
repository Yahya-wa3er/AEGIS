name: CI

# Le red-teaming ne mesure rien s'il ne tourne que quand on y pense. Branché ici,
# une régression de détection fait rougir la PR au lieu d'être découverte trois
# semaines plus tard -- c'est ce que le README annonçait depuis le début
# (« pensé pour être branché en CI/CD ») sans que ce soit fait.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Tests et red-teaming
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Installer les dépendances ML (variante CPU)
        # requirements-ml.txt N'EST PAS utilisé ici, volontairement : il a été
        # généré sur une machine compatible CUDA et épingle donc 15 paquets
        # nvidia-* (~2,5 Go de roues GPU). Un runner GitHub n'a pas de carte
        # graphique : les télécharger ferait exploser la durée du job pour rien.
        #
        # On installe donc la variante CPU depuis l'index PyTorch dédié, puis
        # les paquets purement Python depuis PyPI. Le compromis est assumé et
        # écrit : la CI ne vérifie pas le lock ML tel quel. C'est le prix d'un
        # lock unique généré sur un poste GPU -- la correction propre est un
        # second lock CPU (requirements-ml-cpu.txt), à faire quand quelqu'un
        # d'autre que Yahya installera le projet.
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.6,<3"
          pip install "transformers>=4.44,<6" "scikit-learn>=1.5,<2"

      - name: Le noyau s'importe-t-il SANS les dépendances ML ?
        # Vérifie la promesse de séparation entre requirements.txt et
        # requirements-ml.txt : elle était fausse jusqu'au lot 4B (torch était
        # importé au niveau du module dans injection_detector).
        run: |
          python - <<'PY'
          import subprocess, sys, tempfile, venv, pathlib
          d = tempfile.mkdtemp()
          venv.create(d, with_pip=True)
          py = pathlib.Path(d, "bin", "python")
          # Installation avec les dépendances DÉCLARÉES du noyau (donc sans
          # torch ni transformers) : c'est exactement ce que reçoit quelqu'un
          # qui fait `pip install aegis-guard`.
          subprocess.check_call([py, "-m", "pip", "install", "-q", "."])
          subprocess.check_call([py, "-c", "import aegis_core.middleware; print('noyau importable sans torch : OK')"])
          PY

      - name: Entraîner les détecteurs légers
        # Sans ça, dix tests seraient sautés (voir tests/conftest.py) : en CI on
        # veut au contraire que ces détecteurs soient réellement vérifiés.
        run: |
          python -m scripts.train_rag_outlier_detector
          python -m scripts.train_behavior_vae

      - name: Générer la clé de signature du journal d'audit
        run: python -m scripts.generate_audit_key

      - name: Suite de tests
        # -rsxX liste les tests sautés et les xfail dans le résumé. Un test sauté
        # en CI est un test qui ne protège rien : sur un poste de dev c'est
        # acceptable (le modèle n'est pas entraîné), ici c'est un signal.
        # Une seule exécution suffit à le voir -- relancer pytest deux fois de
        # plus pour compter les SKIPPED coûtait trois fois le temps du job.
        run: |
          python -m pytest -q -rsxX 2>&1 | tee /tmp/pytest.log
          if grep -qE "^SKIPPED|s  *\[" /tmp/pytest.log; then
            echo "::warning::des tests ont été sautés en CI -- vérifier tests/conftest.py"
          fi

      - name: Red-teaming (porte de non-régression)
        # Échoue si le taux de blocage descend sous le plancher OU si les faux
        # positifs dépassent le plafond. Les deux comptent : un détecteur qui
        # bloque tout satisfait le premier critère et ne détecte rien.
        run: python -m redteam.run_redteam

      - name: Construire la roue distribuable
        run: |
          pip install -q build
          python -m build --wheel

  frontend:
    name: Frontend (types, lint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        working-directory: frontend
        run: npm ci

      # `LayoutProps<"/">` et consorts sont des types GÉNÉRÉS par Next dans
      # `.next/types`, que `tsconfig.json` inclut. Sur un clone frais ce
      # répertoire n'existe pas, et `tsc` échouait avant même de regarder le code
      # (« Cannot find name 'LayoutProps' »). Un poste de dev ne le voyait pas :
      # il avait déjà lancé `next dev` ou `next build` au moins une fois.
      - name: Générer les types de routes
        working-directory: frontend
        run: npx next typegen

      - name: Vérification des types
        working-directory: frontend
        run: npx tsc --noEmit -p tsconfig.json

      - name: Lint
        working-directory: frontend
        run: npx eslint src

      - name: Build
        working-directory: frontend
        run: npm run build
